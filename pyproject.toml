[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-vqa"
version = "0.3.0"
description = "A multimodal Visual Question Answering pipeline with training, evaluation, inference, and Gradio demo support."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dongting Shuo" }]
keywords = ["visual-question-answering", "multimodal-learning", "pytorch", "gradio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "transformers>=5.10,<6.0",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "gradio>=6.16,<7.0",
    "fastapi>=0.115.2,<1.0",
    "starlette>=1.3.1,<2.0",
    "pydantic==2.10.6",
    "pydantic-core==2.27.2",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.8"]
tracking = ["wandb>=0.17"]

[project.urls]
Homepage = "https://github.com/dongtingshuo/multimodal-vqa"
Documentation = "https://github.com/dongtingshuo/multimodal-vqa#readme"
Repository = "https://github.com/dongtingshuo/multimodal-vqa"
Issues = "https://github.com/dongtingshuo/multimodal-vqa/issues"

[tool.setuptools.packages.find]
include = ["vqa_project*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"demo.py" = ["E402"]
"scripts/*.py" = ["E402"]
